- title: Research Experience
  type: time_table
  contents:
    - title: Multi-modal self-supervised learning on JWST data
      institution: Max Planck Institute for Astronomy, Heidelberg
      department: "Master's thesis project · Advisors: Dr. Ivelina Momcheva, Dr. Morgan Fouesneau"
      year: 2025 - 2027
      description:
        - Trained an in-house foundation model on sparse, multi-survey JWST data — NIRISS/NIRCam imaging and low-resolution PRISM spectra — fused via CLIP.
        - Enables population-level inference of galaxy properties (e.g. stellar mass) from single-band photometry and spectroscopy.

    - title: Spatially resolved Balmer decrements of individual galaxies
      institution: Max Planck Institute for Astronomy, Heidelberg
      department: "Bachelor thesis · Advisors: Dr. Ivelina Momcheva, Prof. Dr. Hans-Walter Rix"
      year: 2024 - 2025
      description:
        - Analysed HST/CLEAR and JWST OutThere pure-parallel grism spectroscopy.
        - Developed a PSF-matching technique for grism emission-line maps.
        - Produced the first r<sub>eff</sub>-normalized Balmer decrement profiles at z > 1.
        - Constrained the galaxy-to-galaxy scatter in resolved dust attenuation and its relation to stellar mass and resolved star formation.

    - title: Trapping and cooling Rb atoms with a self-built MOT
      institution: Kirchhoff Institute for Physics, Heidelberg University
      department: "Curriculum extension · Advisor: Prof. Dr. Klaus Reygers"
      year: 2023
      description:
        - Built a 3D magneto-optical trap (MOT) from scratch in a student team, cooling and trapping rubidium atoms close to the Doppler limit.
        - Aligned and fine-tuned the optical setup for the cooling laser beams.

    - title: Optical observations with a 70-cm telescope and data reduction
      institution: State Observatory Heidelberg-Königstuhl
      department: "Independent project · Advisor: Prof. Dr. Jochen Heidt"
      year: 2022
      description:
        - Operated the 70-cm telescope.
        - Implemented a data-reduction pipeline for raw stellar images and performed photometry.

